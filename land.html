<style>
  :root { --bg: #FFF4EC; --ink: #3B2430; --sub: #8A6A74; --card: #FFFFFF; --line: #F0D9CF; --yel: #FFC531; --yelD: #C98B00; --pur: #8E5BD9; --padB: 0px; }

  #app { position: relative; max-width: 480px; margin: 0 auto; height: 100vh; height: var(--vh, 100dvh); display: flex; flex-direction: column; padding: env(safe-area-inset-top) 10px calc(10px + env(safe-area-inset-bottom) + var(--padB)); }

  .en { display: flex; align-items: center; gap: 6px; margin: 2px 2px 6px; font-size: 13px; color: var(--sub); }
  .en .bar { flex: 1; display: flex; gap: 2px; } .en .bar i { flex: 1; height: 10px; border-radius: 3px; background: #F0DCD3; } .en .bar i.on { background: var(--pur); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  .cd .ic { height: 36px; display: flex; align-items: center; justify-content: center; } .cd b { display: block; font-size: 14px; } .cd small { display: block; font-size: 11px; color: var(--sub); white-space: nowrap; } .cd .cost { font-size: 12px; color: var(--pur); font-weight: 700; }
  .cd.sel { border-color: var(--pur); background: #F4EEFF; } .cd.low { opacity: .45; }
  .ov { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 14px 0; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ov > .grow { flex: 1 0 8px; }

  .tws { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .tws .row { margin: 0; padding: 6px 8px; align-items: flex-start; } .tws .row small { font-size: 11px; line-height: 1.35; }
  .ov h2 { margin: 0 0 4px; font-size: 21px; } .ov p { margin: 4px 0 10px; color: var(--sub); font-size: 14px; line-height: 1.5; }

  .row .tw { width: 26px; height: 26px; border-radius: 8px; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .row small { color: var(--sub); display: block; font-size: 12px; }
  .pick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 6px 0 10px; }
  .pick button { font: inherit; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px; text-align: left; color: var(--ink); }
  .pick button.on { border-color: var(--pur); background: #F4EEFF; }

<div id="app">

</div>
<script>
'use strict';
// ===== 규칙 (모의 게임 dev2/sim/landsim2.py 와 같은 값) =====
const COST = { tank: 4, swarm: 3, stealth: 3, rush: 3 };
const UNIT = {
  tank:    { n: 2, hp: 14, spd: 28, bite: 2.0, inf: 1.2 },
  swarm:   { n: 7, hp: 1.6, spd: 40, bite: 0.7, inf: 0.7 },
  stealth: { n: 3, hp: 3.0, spd: 34, bite: 0.6, inf: 0.9 },
  rush:    { n: 4, hp: 1.6, spd: 52, bite: 0.5, inf: 0.5 } };
const TOWER = {
  sniper: { rng: 95, dmg: 6.0, cd: 1.4, splash: 0, hp: 26 },
  splash: { rng: 70, dmg: 1.6, cd: 1.2, splash: 26, hp: 24 },
  finder: { rng: 80, dmg: 0.8, cd: 0.8, splash: 0, hp: 18 },
  slow:   { rng: 70, dmg: 0.5, cd: 0.6, splash: 0, hp: 18 } };
const VS = { splash: { swarm: 2.0, tank: 0.5, rush: 1.2 }, sniper: { tank: 2.0, swarm: 0.45, stealth: 1.2 }, slow: { rush: 1.6, tank: 0.8 }, finder: {} };
const K = { stealthCore: 0.5, coreHp: 40, coreLink: 2, hatchEvery: 2.2, chunkR: 48, star3T: 40, twdmg: 4, twhp: 3, cure: 1.0, ecell: 0.6, tlim: 75, cmb: 2.5, eBase: 0.45, ePer: 0.035, eCap: 10, eStart: 5 };
const ROWS = 11, COLS = 9;
const CARD = {   // 화면에 보이는 카드: 좋아하는 목표 한 줄
  tank:    { i: '🛡', n: '방패', t: '탑부터 · 맞아 줌', col: '#7A4FC4' },
  swarm:   { i: '🐜', n: '떼', t: '가까운 칸 · 방패 옆 2.5배', col: '#9B6BE0' },
  stealth: { i: '👻', n: '숨기', t: '핵심으로 · 찾기 탑에만 들킴', col: '#B49BE8' },
  rush:    { i: '⚡', n: '돌격', t: '탑 없는 빈 땅', col: '#6B3FB0' } };
const TWI = {
  sniper: { n: '저격', l: '저', col: '#E0603A', t: '체력 큰 것 한 마리씩 세게 · 방패에 2배' },
  splash: { n: '범위', l: '범', col: '#F0A030', t: '뭉친 무리에 큰 피해 · 떼에 2배' },
  finder: { n: '찾기', l: '찾', col: '#3A8DDE', t: '숨기를 드러냄(피해는 없음)' },
  slow:   { n: '느림', l: '느', col: '#2BB3A3', t: '느리게 함 · 돌격에 1.6배' } };
const IMG = {}; const IMGN = { bg: 'bg_lung', core: 'goal_lung', splash: 'macro', sniper: 'tcell', finder: 'dendri', slow: 'cilia', tank: 'adeno', swarm: 'rhino', stealth: 'herpes', rush: 'rota' };
for (const [k, n] of Object.entries(IMGN)) { const im = new Image(); im.src = 'assets/' + n + '.webp'; IMG[k] = im; }
const ok = im => im && im.complete && im.naturalWidth > 0;
const drawImg = (im, x, y, h) => { const w = h * im.naturalWidth / im.naturalHeight; ctx.drawImage(im, x - w / 2, y - h / 2, w, h); };
const STAGE = { name: '폐 · 세 입구', walls: { 5: [1, 4, 7] }, towers: [['splash', 4, 1], ['sniper', 3, 4], ['slow', 4, 7], ['finder', 1, 3]], core: [0, 4],
  entries: [{ n: '왼쪽 기관지', rc: [9, 1] }, { n: '가운데 기관', rc: [10, 4] }, { n: '오른쪽 혈관', rc: [9, 7] }] };

const pos = (r, c) => [30 + c * 37 + (r % 2 ? 18 : 0), 30 + r * 32];
const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ===== 판 =====
class Game {
  constructor(stage, deck, seed, entry) {
    this.rnd = mulberry(seed || 1); this.stage = stage; this.deck = deck.slice();
    this.cells = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const p = pos(r, c); if (p[0] > 330) continue;
      const wall = stage.walls[r] !== undefined && !stage.walls[r].includes(c);
      this.cells.push({ i: this.cells.length, r, c, p, wall, inf: false, tower: null, flash: 0 }); }
    this.by = {}; for (const c of this.cells) this.by[c.r + ',' + c.c] = c;
    for (const c of this.cells) c.nb = this.cells.filter(o => o !== c && !o.wall && d2(o.p, c.p) < 44).map(o => o.i);
    for (const [k, r, c] of stage.towers) this.by[r + ',' + c].tower = { k, hp: TOWER[k].hp * K.twhp, mhp: TOWER[k].hp * K.twhp, cd: 0, cure: 0, tk: -9, shot: 0 };
    this.core = this.by[stage.core.join(',')];
    const en = stage.entries[entry || 0]; this.entry = entry || 0; this.hatch = this.by[en.rc.join(',')];   // 침투 지점 → 부화장
    for (const c of this.cells) if (!c.wall && d2(c.p, this.hatch.p) <= 44) c.inf = true;
    this.coreHp = K.coreHp; this.won = false; this.hatchT = 0; this.conn = new Set(); this.linkCore();
    this.units = []; this.t = 0; this.e = K.eStart; this.ci = 0; this.sent = { tank: 0, swarm: 0, stealth: 0, rush: 0 }; this.lost = 0; this.fx = []; this.over = false;
  }
  towers() { return this.cells.filter(c => c.tower && c.tower.hp > 0); }
  walkable(c) { return !c.wall && !(c.tower && c.tower.hp > 0); }
  healthy() { return this.cells.filter(c => !c.wall && !c.inf && c !== this.core && !(c.tower && c.tower.hp > 0)); }
  linkCore() { const S = new Set([this.hatch.i]), q = [this.hatch.i];   // 부화장과 이어진 점막만 내 땅
    for (let h = 0; h < q.length; h++) for (const j of this.cells[q[h]].nb) { const c = this.cells[j]; if (c.inf && !S.has(j)) { S.add(j); q.push(j); } }
    this.conn = S; }
  coreLinked() { return this.core.nb.some(j => this.conn.has(j)); }
  frontier() { const inf = this.cells.filter(c => c.inf && this.conn.has(c.i)); const f = inf.filter(c => c.nb.some(j => !this.cells[j].inf)); return f.length ? f : inf; }
  pct() { const o = this.cells.filter(c => !c.wall); return o.filter(c => c.inf).length / o.length; }
  covered(p) { return this.towers().filter(t => d2(t.p, p) <= TOWER[t.tower.k].rng); }
  bfs(s) { const dist = new Map([[s, 0]]), prev = new Map([[s, null]]), q = [s];
    for (let h = 0; h < q.length; h++) { const i = q[h]; if (i !== s && !this.walkable(this.cells[i])) continue;
      for (const j of this.cells[i].nb) if (!dist.has(j)) { dist.set(j, dist.get(i) + 1); prev.set(j, i); q.push(j); } }
    return [dist, prev]; }
  path(prev, j) { const o = []; while (j !== null && j !== undefined) { o.push(j); j = prev.get(j); } return o.reverse(); }
  targetFor(k, s) {
    const [dist, prev] = this.bfs(s), tw = this.towers().filter(t => dist.has(t.i)); let t = null;
    const near = a => a.reduce((b, c) => !b || dist.get(c.i) < dist.get(b.i) ? c : b, null);
    if (k !== 'stealth' && k !== 'tank' && !this.won && this.coreLinked() && dist.has(this.core.i)) t = this.core;   // 점막이 핵심에 닿으면 모두 핵심으로
    else if (k === 'tank' && tw.length) t = near(tw);
    else if (k === 'stealth' && !this.won && dist.has(this.core.i)) t = this.core;
    else { let hs = this.healthy().filter(c => dist.has(c.i));
      if (k === 'rush') { const safe = hs.filter(c => !this.covered(c.p).length); if (safe.length) hs = safe; }
      let cand = hs.concat(k === 'rush' && hs.length ? [] : tw); if (!cand.length) cand = tw; if (!cand.length && dist.has(this.core.i)) cand = [this.core]; if (!cand.length) return [null, null]; t = near(cand); }
    return [t, this.path(prev, t.i)]; }
  danger(k, pth) { let s = 0; for (const i of pth) for (const t of this.covered(this.cells[i].p)) { const tk = t.tower.k; if (tk === 'finder' && k !== 'stealth') continue; s += TOWER[tk].dmg * (VS[tk][k] || 1) / TOWER[tk].cd; } return s; }
  deploy(k, cell) {
    if (this.e < COST[k] || !cell || !cell.inf || !this.conn.has(cell.i)) return false;
    const U = UNIT[k]; this.e -= COST[k]; this.sent[k]++;
    for (let n = 0; n < U.n; n++) this.units.push({ k, p: [cell.p[0] + (this.rnd() - .5) * 12, cell.p[1] + (this.rnd() - .5) * 12], at: cell.i, hp: U.hp, mhp: U.hp, path: [], tgt: null, work: 0, slow: 0, seen: 0 });
    this.fx.push({ p: cell.p, t: 0, k: 'drop' }); return true; }
  botChoose(pol) {   // 시험용 봇 (모의 게임과 같은 규칙)
    const types = this.deck, k = types[this.ci % types.length]; if (this.e < COST[k]) return null; this.ci++;
    const fr = this.frontier(); const pick = a => a[Math.floor(this.rnd() * a.length)];
    if (pol === 'rand') return [k, pick(fr)];
    let best = null, bs = pol === 'worst' ? -1 : 1e9;
    for (const c of fr) { const [t, pth] = this.targetFor(k, c.i); if (!t) continue;
      const sc = pol === 'worst' ? this.danger(k, pth) + pth.length * .5 : k === 'tank' ? pth.length * 2 : this.danger(k, pth) + pth.length * .5;
      if (pol === 'worst' ? sc > bs : sc < bs) { bs = sc; best = c; } }
    return [k, best || pick(fr)]; }
  step(DT) {
    if (this.over) return; this.t += DT;
    this.linkCore(); const ninf = this.conn.size;
    this.hatchT += DT; if (this.hatchT >= K.hatchEvery) { this.hatchT = 0;   // 부화장 혼자 번짐(가장 가까운 빈 땅 하나)
      const cand = this.healthy().filter(c => c.nb.some(j => this.conn.has(j)) && !this.covered(c.p).length);
      if (cand.length) { const c = cand.reduce((b, c) => d2(c.p, this.hatch.p) < d2(b.p, this.hatch.p) ? c : b); c.inf = true; c.flash = .4; } }
    this.e = Math.min(K.eCap, this.e + (K.eBase + K.ePer * K.ecell * ninf) * DT);
    for (const tc of this.towers()) { const tw = tc.tower; tw.cure += K.cure * DT;   // 면역 반격
      if (tw.cure >= 1) { tw.cure -= 1; const cand = this.cells.filter(c => c.inf && !c.tower && c !== this.core && c !== this.hatch && c.nb.some(j => !this.cells[j].inf) && d2(c.p, tc.p) <= TOWER[tw.k].rng && !this.units.some(u => d2(u.p, c.p) < 14));
        if (cand.length) { const c = cand.reduce((b, c) => d2(c.p, tc.p) < d2(b.p, tc.p) ? c : b); c.inf = false; c.flash = 0.6; this.fx.push({ p: c.p, t: 0, k: 'cure', from: tc.p }); } } }
    for (const tc of this.towers()) { const T = TOWER[tc.tower.k], tw = tc.tower; tw.cd -= DT; tw.shot = Math.max(0, tw.shot - DT);
      const inr = this.units.filter(u => d2(u.p, tc.p) <= T.rng);
      if (tw.k === 'finder') { for (const u of inr) u.seen = 0.5; continue; }
      const vis = inr.filter(u => u.k !== 'stealth' || u.seen > 0);
      if (tw.k === 'slow') for (const u of vis) u.slow = 0.5;
      if (tw.cd > 0 || !vis.length) continue; tw.cd = T.cd; tw.shot = 0.15;
      const tk = vis.filter(u => u.k === 'tank'), pool = tk.length ? tk : vis;
      const tgt = tw.k === 'sniper' ? pool.reduce((b, u) => u.hp > b.hp ? u : b) : pool.reduce((b, u) => d2(u.p, tc.p) < d2(b.p, tc.p) ? u : b);
      const hits = T.splash ? this.units.filter(u => d2(u.p, tgt.p) <= T.splash) : [tgt];
      for (const u of hits) u.hp -= T.dmg * K.twdmg * (VS[tw.k][u.k] || 1);
      this.fx.push({ p: tgt.p, from: tc.p, t: 0, k: 'shot', s: T.splash, col: TWI[tw.k].col }); }
    for (const u of this.units) { const U = UNIT[u.k]; u.seen = Math.max(0, u.seen - DT); u.slow = Math.max(0, u.slow - DT);
      let t = u.tgt; const tAlive = t && t.tower && t.tower.hp > 0;
      const stale = !t || (t.inf && !tAlive) || (t.tower && t.tower.hp <= 0 && t.inf);
      if (stale || (!u.path.length && t && d2(u.p, t.p) > 12)) { const [nt, pth] = this.targetFor(u.k, u.at); u.tgt = t = nt; u.path = (pth || []).slice(1); u.work = 0; }
      if (!t) continue;
      if (u.path.length) { const nx = this.cells[u.path[0]];
        if (!this.walkable(nx) && nx !== t) { u.tgt = null; continue; }
        const dist = d2(u.p, nx.p), s = U.spd * (u.slow > 0 ? .45 : 1) * DT;
        if (dist <= s || (nx === t && dist < 12)) { if (nx !== t) u.p = nx.p.slice(); u.at = nx.i; u.path.shift(); if (nx !== t) continue; }
        else { u.p = [u.p[0] + (nx.p[0] - u.p[0]) / dist * s, u.p[1] + (nx.p[1] - u.p[1]) / dist * s]; continue; } }
      if (t.tower && t.tower.hp > 0) { if (u.k === 'tank') t.tower.tk = this.t;
        const cmb = u.k === 'swarm' && this.t - t.tower.tk < 1 ? K.cmb : 1; t.tower.hp -= U.bite * cmb * DT;
        if (cmb > 1 && this.rnd() < .02) this.fx.push({ p: t.p, t: 0, k: 'txt', s: '방패+떼!' });
        if (t.tower.hp <= 0) { t.inf = true; for (const c of this.cells) if (!c.wall && c !== this.core && !(c.tower && c.tower.hp > 0) && d2(c.p, t.p) <= K.chunkR) { c.inf = true; c.flash = .6; } this.fx.push({ p: t.p, t: 0, k: 'boom' }); this.fx.push({ p: t.p, t: 0, k: 'txt', s: '탑 파괴! 점막 확보' }); } }
      else if (t === this.core) { if (this.won) { u.tgt = null; continue; } const link = this.coreLinked() ? K.coreLink : 1; this.coreHp -= U.bite * link * (u.k === 'stealth' ? K.stealthCore : 1) * DT;   // 핵심 방어막: 점막이 이어지면 보급 2배
        if (this.rnd() < .03) this.fx.push({ p: t.p, t: 0, k: 'txt', s: link > 1 ? '보급 ×2!' : '방어막 깨는 중' });
        if (this.coreHp <= 0) { this.won = true; this.wonT = this.t; this.core.inf = true; for (const c of this.cells) if (!c.wall && !(c.tower && c.tower.hp > 0) && d2(c.p, t.p) <= K.chunkR) c.inf = true; this.fx.push({ p: t.p, t: 0, k: 'boom' }); } }
      else { u.work += DT; if (u.work >= U.inf) { t.inf = true; t.flash = 0.5; u.tgt = null; } } }
    const dead = this.units.filter(u => u.hp <= 0); this.lost += dead.length; for (const u of dead) this.fx.push({ p: u.p, t: 0, k: 'pop' });
    this.units = this.units.filter(u => u.hp > 0);
    for (const c of this.cells) if (c.flash > 0) c.flash -= DT;
    for (const f of this.fx) f.t += DT; this.fx = this.fx.filter(f => f.t < (f.k === 'txt' ? 1 : .5));
    if (this.t >= K.tlim || this.won) this.over = true;
  }
  stars() { return [this.won, this.won && !this.towers().length, this.won && this.wonT <= K.star3T]; }
}
// 봇 (시험용): window.botRun(['tank','rush'], 'smart'|'rand'|'worst', seed)
window.botRun = (deck, pol, seed, entry) => { const g = new Game(STAGE, deck, seed, entry); while (!g.over) { const ch = g.botChoose(pol); if (ch) g.deploy(ch[0], ch[1]); g.step(0.1); }
  return { pct: +g.pct().toFixed(3), stars: g.stars().filter(Boolean).length, won: g.won, t: +(g.wonT || g.t).toFixed(1), towers: g.towers().length, lost: g.lost }; };

// ===== 화면 =====
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let scouting = false, entrySel = 1, G = null, sel = null, deck = ['tank', 'swarm', 'stealth', 'rush'], info = null, scale = 1, ox = 0, oy = 0;
const W = 360, H = 360;
function fit() { const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.height * dpr;
  scale = Math.min(r.width / W, r.height / H) * dpr; ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2; }
const setVH = () => { document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); fit(); };
window.addEventListener('resize', setVH); if (window.visualViewport) visualViewport.addEventListener('resize', setVH);
const toMap = (cx, cy) => { const r = cv.getBoundingClientRect(), dpr = cv.width / r.width; return [((cx - r.left) * dpr - ox) / scale, ((cy - r.top) * dpr - oy) / scale]; };
const cellAt = p => { let b = null, bd = 24; for (const c of G.cells) { const d = d2(c.p, p); if (d < bd) { bd = d; b = c; } } return b; };
const hint = h => document.getElementById('hint').innerHTML = h;

const lay = document.createElement('canvas'), lctx = lay.getContext('2d');
function drawCreep(fr) {   // 점막: 칸 대신 이어진 얼룩 (이어진 곳 보라, 끊긴 곳 회색)
  const S = 2; if (lay.width !== W * S) { lay.width = W * S; lay.height = (H + 20) * S; }
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, lay.width, lay.height); lctx.setTransform(S, 0, 0, S, 0, 0);
  const tt = performance.now() / 600, inf = G.cells.filter(c => c.inf && c !== G.core);
  const pass = (rad, col, sel) => { lctx.fillStyle = col; lctx.beginPath(); for (const c of inf) { if (!sel(c)) continue; const r = rad + Math.sin(tt + c.i * 1.7) * 1.2 + (c.flash > 0 ? 3 : 0); lctx.moveTo(c.p[0] + r, c.p[1]); lctx.arc(c.p[0], c.p[1], r, 0, 7); } lctx.fill(); };
  if (fr) pass(31, '#FFC531', c => fr.has(c.i));
  pass(27, '#5B2AA8', c => G.conn.has(c.i)); pass(27, '#7D7488', c => !G.conn.has(c.i));
  pass(23, '#8E5BD9', c => G.conn.has(c.i)); pass(23, '#A9A1B3', c => !G.conn.has(c.i));
  lctx.fillStyle = 'rgba(255,255,255,.18)'; for (const c of inf) { if (!G.conn.has(c.i)) continue; lctx.beginPath(); lctx.arc(c.p[0] - 5 + Math.sin(tt * .7 + c.i) * 2, c.p[1] - 5, 3.2, 0, 7); lctx.fill(); }
  ctx.globalAlpha = .82; ctx.drawImage(lay, 0, 0, W, H + 20); ctx.globalAlpha = 1;
  const h = G.hatch, pul = 1 + Math.sin(performance.now() / 300) * .06;   // 부화장
  ctx.beginPath(); ctx.ellipse(h.p[0], h.p[1], 19 * pul, 15 * pul, 0, 0, 7); ctx.fillStyle = '#3E1675'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#C9A2FF'; ctx.stroke();
  for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(h.p[0] + Math.cos(k * 1.26 + tt) * 8, h.p[1] + Math.sin(k * 1.26 + tt) * 6, 3, 0, 7); ctx.fillStyle = '#E6CCFF'; ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('부화장', h.p[0], h.p[1] + 28); }
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (!G) return; ctx.setTransform(scale, 0, 0, scale, ox, oy);
  if (ok(IMG.bg)) { const im = IMG.bg, bw = W + 40, bh = bw * im.naturalHeight / im.naturalWidth; ctx.save(); ctx.beginPath(); ctx.roundRect(-14, 4, W + 28, H + 4, 18); ctx.clip(); ctx.drawImage(im, -20, (H - bh) / 2, bw, bh); ctx.fillStyle = 'rgba(255,240,232,.18)'; ctx.fillRect(-20, 0, bw, H + 20); ctx.restore(); }
  for (const tc of G.towers()) { const T = TOWER[tc.tower.k]; ctx.beginPath(); ctx.arc(tc.p[0], tc.p[1], T.rng, 0, 7); ctx.fillStyle = TWI[tc.tower.k].col + '14'; ctx.fill(); ctx.setLineDash([5, 4]); ctx.strokeStyle = TWI[tc.tower.k].col + '88'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]); }
  { const rows = {}; for (const c of G.cells) if (c.wall) (rows[c.r] = rows[c.r] || []).push(c);   // 세포막: 이어진 띠로
    ctx.strokeStyle = '#C9708F'; ctx.lineCap = 'round'; ctx.lineWidth = 22;
    for (const r in rows) { const a = rows[r].sort((x, y) => x.c - y.c); let run = [a[0]];
      const flush = () => { ctx.beginPath(); ctx.moveTo(run[0].p[0], run[0].p[1]); ctx.lineTo(run[run.length - 1].p[0] + .1, run[run.length - 1].p[1]); ctx.stroke(); };
      for (let i = 1; i < a.length; i++) { if (a[i].c === a[i - 1].c + 1) run.push(a[i]); else { flush(); run = [a[i]]; } } flush(); }
    ctx.fillStyle = '#9C4A68'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    for (const r in rows) { const gates = G.cells.filter(c => c.r == r && !c.wall); for (const g of gates) ctx.fillText('입구', g.p[0], g.p[1] + 25); } }
  const fr = sel ? new Set(G.frontier().map(c => c.i)) : null;
  drawCreep(fr);
  if (scouting) for (const [n, e] of STAGE.entries.entries()) { const c = G.by[e.rc.join(',')]; ctx.beginPath(); ctx.arc(c.p[0], c.p[1], 16, 0, 7); ctx.fillStyle = n === entrySel ? 'rgba(255,197,49,.95)' : 'rgba(255,255,255,.85)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#C98B00'; ctx.stroke(); ctx.fillStyle = '#4A3200'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(n + 1), c.p[0], c.p[1] + 5); }
  { const c = G.core; ctx.beginPath(); ctx.arc(c.p[0], c.p[1], 18, 0, 7); ctx.fillStyle = G.won ? 'rgba(126,72,214,.9)' : 'rgba(255,216,107,.92)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#C98B00'; ctx.stroke();
    if (!G.won) { ctx.beginPath(); ctx.arc(c.p[0], c.p[1], 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.coreHp / K.coreHp); ctx.lineWidth = 4; ctx.strokeStyle = G.coreLinked() ? '#FF6BA8' : '#4FB3FF'; ctx.stroke(); }
    if (ok(IMG.core)) drawImg(IMG.core, c.p[0], c.p[1] - 4, 34); ctx.fillStyle = '#4A3200'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(G.won ? '장악!' : '핵심 · 방어막', c.p[0], c.p[1] + 32); }
  for (const tc of G.towers()) { const tw = tc.tower, I = TWI[tw.k], x = tc.p[0], y = tc.p[1];
    ctx.textAlign = 'center';
    if (ok(IMG[tw.k])) { const pul = tw.shot > 0 ? 1.12 : 1; ctx.beginPath(); ctx.ellipse(x, y + 13, 15, 5, 0, 0, 7); ctx.fillStyle = 'rgba(60,20,30,.25)'; ctx.fill(); drawImg(IMG[tw.k], x, y - 2, 38 * pul); }
    else { ctx.fillStyle = I.col; ctx.beginPath(); ctx.roundRect(x - 14, y - 14, 28, 28, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(I.l, x, y + 5); }
    ctx.fillStyle = '#0002'; ctx.fillRect(x - 14, y + 17, 28, 4); ctx.fillStyle = I.col; ctx.fillRect(x - 14, y + 17, 28 * Math.max(0, tw.hp / tw.mhp), 4);
    ctx.fillStyle = I.col; ctx.font = 'bold 10px sans-serif'; ctx.fillText(I.n, x, y + 32); }
  const USZ = { tank: 27, swarm: 17, stealth: 21, rush: 20 };
  for (const u of G.units) { const x = u.p[0], y = u.p[1]; ctx.globalAlpha = u.k === 'stealth' && !(u.seen > 0) ? .45 : 1;
    if (ok(IMG[u.k])) { drawImg(IMG[u.k], x, y - 3, USZ[u.k]); if (u.hp < u.mhp) { ctx.fillStyle = '#0005'; ctx.fillRect(x - 6, y + USZ[u.k] / 2 - 2, 12, 2.5); ctx.fillStyle = '#7CFC9A'; ctx.fillRect(x - 6, y + USZ[u.k] / 2 - 2, 12 * Math.max(0, u.hp / u.mhp), 2.5); } ctx.globalAlpha = 1; continue; }
    ctx.fillStyle = CARD[u.k].col; ctx.beginPath();
    if (u.k === 'tank') { ctx.arc(x, y, 7, 0, 7); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#3B2430'; ctx.stroke(); }
    else if (u.k === 'swarm') { ctx.arc(x, y, 3.2, 0, 7); ctx.fill(); }
    else if (u.k === 'rush') { ctx.ellipse(x, y, 5.5, 3, 0, 0, 7); ctx.fill(); }
    else { ctx.arc(x, y, 5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; }
  for (const f of G.fx) { const a = 1 - f.t / .5; ctx.globalAlpha = Math.max(0, a);
    if (f.k === 'shot') { ctx.strokeStyle = f.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.from[0], f.from[1]); ctx.lineTo(f.p[0], f.p[1]); ctx.stroke(); if (f.s) { ctx.beginPath(); ctx.arc(f.p[0], f.p[1], f.s, 0, 7); ctx.stroke(); } }
    else if (f.k === 'cure') { ctx.strokeStyle = '#3BB273'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.from[0], f.from[1]); ctx.lineTo(f.p[0], f.p[1]); ctx.stroke(); ctx.fillStyle = '#3BB273'; ctx.font = 'bold 11px sans-serif'; ctx.fillText('회복', f.p[0], f.p[1] - 14); }
    else if (f.k === 'boom') { ctx.fillStyle = '#FFC531'; ctx.beginPath(); ctx.arc(f.p[0], f.p[1], 10 + f.t * 60, 0, 7); ctx.fill(); }
    else if (f.k === 'drop') { ctx.strokeStyle = '#FFC531'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.p[0], f.p[1], 8 + f.t * 40, 0, 7); ctx.stroke(); }
    else if (f.k === 'pop') { ctx.fillStyle = '#3B2430'; ctx.beginPath(); ctx.arc(f.p[0], f.p[1], 2 + f.t * 10, 0, 7); ctx.fill(); }
    else if (f.k === 'txt') { ctx.globalAlpha = 1 - f.t; ctx.fillStyle = '#C98B00'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(f.s, f.p[0], f.p[1] - 24 - f.t * 10); }
    ctx.globalAlpha = 1; }
  if (info) { const I = TWI[info.tower.k], x = Math.min(250, Math.max(10, info.p[0] - 110)), y = Math.max(4, info.p[1] - 66);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = I.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, 220, 40, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = I.col; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(I.n + ' 탑', x + 9, y + 16); ctx.fillStyle = '#3B2430'; ctx.font = '11px sans-serif'; ctx.fillText(I.t, x + 9, y + 32); ctx.textAlign = 'center'; }
}

function cardsUI() {
  document.getElementById('cards').innerHTML = deck.map(k => `<button class="cd" data-k="${k}"><div class="ic"><img src="assets/${IMGN[k]}.webp" alt="" style="height:34px"></div><b>${CARD[k].n}</b><small>${CARD[k].t.split(' · ')[0]}</small><span class="cost">🧬${COST[k]}</span></button>`).join('');
  document.querySelectorAll('.cd').forEach(b => {
    b.onpointerdown = ev => { if (!G || G.over) return; sel = b.dataset.k; drag = { k: sel, moved: false, sx: ev.clientX, sy: ev.clientY }; b.setPointerCapture(ev.pointerId); upd(); };
    b.onpointermove = ev => { if (drag && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 12) drag.moved = true; };
    b.onpointerup = ev => { if (drag && drag.moved) { const r = cv.getBoundingClientRect(); if (ev.clientY < r.bottom && ev.clientY > r.top) place(toMap(ev.clientX, ev.clientY)); } drag = null; }; }); }
let drag = null;
function place(p) {
  const tw = G.towers().reduce((b, t) => { const d = d2(t.p, p); return d < 26 && (!b || d < d2(b.p, p)) ? t : b; }, null);
  if (tw) { info = tw; setTimeout(() => { if (info === tw) info = null; }, 2600); return; }
  let c = cellAt(p);
  if (sel && (!c || !c.inf)) { const near = G.frontier().reduce((b, f) => { const d = d2(f.p, p); return d < 46 && (!b || d < d2(b.p, p)) ? f : b; }, null); if (near) c = near; }   // 손가락 오차: 가까운 보라 땅으로
  if (!c) return;
  if (!sel) { hint('먼저 아래 카드를 고르세요'); return; }
  if (!c.inf || !G.conn.has(c.i)) { hint(c.inf ? '끊긴 점막(회색)에는 못 놓아요 · 부화장과 다시 이어 주세요' : '<b>보라 점막</b> 위에만 놓을 수 있어요'); return; }
  if (G.e < COST[sel]) { hint('🧬 에너지가 모자라요 · 감염한 땅이 많을수록 빨리 차요'); return; }
  G.deploy(sel, c); hint(CARD[sel].i + ' ' + CARD[sel].n + ': ' + CARD[sel].t); }
cv.addEventListener('pointerdown', ev => { if (!G) return; const p = toMap(ev.clientX, ev.clientY);
  if (scouting) { STAGE.entries.forEach((e, n) => { if (d2(G.by[e.rc.join(',')].p, p) < 34) setEntry(n); }); return; }
  if (!G.over) place(p); });

function upd() {
  if (!G) return; const p = 1 - Math.max(0, G.coreHp) / K.coreHp, st = G.stars();
  document.querySelector('#prog i').style.width = (p * 100).toFixed(1) + '%';
  document.querySelectorAll('#stars span').forEach((s, i) => s.className = st[i] ? 'on' : '');
  document.getElementById('time').textContent = Math.max(0, Math.ceil(K.tlim - G.t));
  document.getElementById('ebar').innerHTML = Array.from({ length: K.eCap }, (_, i) => `<i class="${i < Math.floor(G.e) ? 'on' : ''}"></i>`).join('');
  document.getElementById('enum').textContent = Math.floor(G.e);
  document.querySelectorAll('.cd').forEach(b => { b.classList.toggle('sel', b.dataset.k === sel); b.classList.toggle('low', G.e < COST[b.dataset.k]); }); }

function scout() {   // 정찰 → 덱 고르기
  G = new Game(STAGE, deck, 1); fit(); draw(); sel = null;
  const ov = document.getElementById('ov'); ov.hidden = false;
  const tws = STAGE.towers.map(t => t[0]);
  ov.innerHTML = `<h2>🔍 정찰: 폐</h2><p>분홍 막은 못 지나가요 · 입구 3곳 · 바이러스는 <b>놓은 자리에서</b> 좋아하는 목표로 가요</p>
    <div class="tws">${[...new Set(tws)].map(k => `<div class="row"><img src="assets/${IMGN[k]}.webp" alt="" style="height:34px;flex:0 0 auto"><div><b style="color:${TWI[k].col}">${TWI[k].n}</b> ×${tws.filter(x => x === k).length}<small>${TWI[k].t}</small></div></div>`).join('')}
    <div class="row"><span class="tw" style="background:#3BB273">+</span><div><b>면역 반격</b><small>탑이 주변 감염을 되돌려요</small></div></div></div>
    <p style="margin:10px 0 0"><b>덱 고르기</b> (1~4장)</p>
    <div class="pick">${Object.keys(CARD).map(k => `<button data-k="${k}" class="${deck.includes(k) ? 'on' : ''}"><img src="assets/${IMGN[k]}.webp" alt="" style="height:30px;vertical-align:middle"> <b>${CARD[k].n}</b> 🧬${COST[k]}<small>${CARD[k].t}</small></button>`).join('')}</div>
    <div class="row"><span class="tw" style="background:#8E5BD9">점</span><div><b>점막</b><small>부화장과 이어진 보라 점막에만 카드를 놓아요 · 넓을수록 에너지 ↑ · 끊기면 회색</small></div></div>
    <p style="font-size:12px;margin:6px 0 0">목표: 핵심 방어막 깨기(점막이 핵심까지 이어지면 모두 몰려가고 2배) · ★ 장악 ★ 탑 전부 파괴 ★ ${K.star3T}초 안 · 제한 ${K.tlim}초</p><div class="grow"></div>
    <div class="stick"><button class="go" id="bGo">다음: 침투 지점 고르기</button></div>`; ov.scrollTop = 0;
  ov.querySelectorAll('.pick button').forEach(b => b.onclick = () => { const k = b.dataset.k;
    if (deck.includes(k)) { if (deck.length > 1) deck = deck.filter(x => x !== k); } else deck = [...deck, k].sort((a, b) => Object.keys(CARD).indexOf(a) - Object.keys(CARD).indexOf(b));
    ov.querySelectorAll('.pick button').forEach(x => x.classList.toggle('on', deck.includes(x.dataset.k))); });
  document.getElementById('bGo').onclick = pickEntry; }
function pickEntry() {   // 지도를 보며 침투 지점 고르기
  scouting = true; document.getElementById('ov').hidden = true; G = new Game(STAGE, deck, 1, entrySel); fit();
  hint('<b>침투할 곳</b>을 고르세요 · 가까운 입구와 탑이 달라져요');
  document.getElementById('cards').innerHTML = STAGE.entries.map((e, n) => `<button class="cd${n === entrySel ? ' sel' : ''}" data-e="${n}"><div class="ic" style="font-size:22px;font-weight:800;color:#8E5BD9">${n + 1}</div><b style="font-size:13px">${e.n}</b></button>`).join('') + `<button class="cd" id="bStart" style="background:var(--yel);border-color:var(--yelD)"><div class="ic">🦠</div><b>시작</b></button>`;
  document.querySelectorAll('.cd[data-e]').forEach(b => b.onclick = () => setEntry(+b.dataset.e)); document.getElementById('bStart').onclick = start; }
function setEntry(n) { entrySel = n; G = new Game(STAGE, deck, 1, n); document.querySelectorAll('.cd[data-e]').forEach(b => b.classList.toggle('sel', +b.dataset.e === n)); }
function start() { scouting = false; G = new Game(STAGE, deck, (Math.random() * 1e9) | 0, entrySel); sel = deck[0]; document.getElementById('ov').hidden = true; cardsUI(); upd(); hint('카드를 고르고 <b>보라 점막</b>(노란 테두리)을 누르거나 끌어다 놓으세요'); last = performance.now(); }
function result() { const st = G.stars(), n = st.filter(Boolean).length, ov = document.getElementById('ov'); ov.hidden = false;
  ov.innerHTML = `<h2>${G.won ? '핵심 장악!' : '면역에 막혔어요'} ${'★'.repeat(n)}${'☆'.repeat(3 - n)}</h2><p>${G.won ? '장악 ' + G.wonT.toFixed(0) + '초' : '방어막 ' + Math.round(100 - 100 * G.coreHp / K.coreHp) + '% 깸'} · 남은 탑 ${G.towers().length}개 · 점막 ${(G.pct() * 100).toFixed(0)}% · 잃은 바이러스 ${G.lost}마리<br>침투: ${STAGE.entries[G.entry].n} · 보낸 카드: ${deck.map(k => CARD[k].i + G.sent[k]).join(' ')}</p>
    <div class="row"><div><b>별</b><small>${st[0] ? '★' : '☆'} 핵심 장악 · ${st[1] ? '★' : '☆'} 탑 전부 파괴 · ${st[2] ? '★' : '☆'} ${K.star3T}초 안</small></div></div>
    <div class="row"><div><b>생각해 볼 점</b><small>${G.won ? (st[1] ? '다른 침투 지점이나 덱으로 더 빨리 해 보세요.' : '탑을 다 부수고 장악하면 별이 하나 더예요. 방패 옆에 떼를 놓으면 탑이 빨리 깨져요.') : '점막을 핵심까지 이으면 모두 핵심으로 몰려가고 방어막이 2배로 깨져요. 숨기는 혼자 몰래 가지만 힘이 약해요.'}</small></div></div>
    <div class="grow"></div><div class="stick"><button class="go" id="bAgain">다시 정찰</button></div>`; ov.scrollTop = 0; document.getElementById('bAgain').onclick = scout; }

let last = performance.now(), acc = 0;
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (G && document.getElementById('ov').hidden && !G.over) { acc += dt; while (acc >= 1 / 30) { G.step(1 / 30); acc -= 1 / 30; } upd(); if (G.over) result(); }
  draw(); requestAnimationFrame(loop); }
setVH(); cardsUI(); scout(); requestAnimationFrame(loop);
</script>
</body>
</html>
