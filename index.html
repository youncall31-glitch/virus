function autoSquad() {   // 고른 기관에 맞춰 카드 3장과 자리(대장·속도·공격)를 함께 고른다: 잘 먹히는 바이러스·적성 대장 우대

$('hornBtn').onclick = () => { if (!run) return; if (hornAim) { hornAim = false; $('hornBtn').classList.remove('aim'); $('hint').textContent = ''; return; }
  if (!(run.hornN ?? 1)) return toast('나팔은 감염 50%에서 한 번 더 충전돼요'); hornAim = true; $('hornBtn').classList.add('aim'); $('hint').textContent = '📯 모일 곳을 길 위에서 누르세요'; };
$('bGo').onclick = startRun; $('bGo2').onclick = startRun;
$('btnSpeed').onclick = () => { speedMul = speedMul === 1 ? 2 : 1; $('btnSpeed').textContent = speedMul + '×'; };
$('coachSkip').onclick = () => tutEnd(true);
$('coachNext').onclick = () => { if (!run || !run.tutOn) return; if (run.tutPause) { run.tutPause = false; paused = false; } if (TL()[run.tutStep].last) return tutEnd(); run.tutStep++; tutShow(); };
$('btnPause').onclick = () => { if (!run || run.over) return; paused = true;   // 일시정지 메뉴: 계속 · 이 기관 다시 시작 · 나가기
  ui.modal(`<h3 style="margin:0 0 6px">일시정지</h3><div class="sub">${run.st.organ.name} · ${stealthOn() ? '잠입 중' : '침투 중'}</div>
    <div class="row"><button class="btn green" id="pzGo" style="flex-basis:100%">계속하기</button><button class="btn red" id="pzRe">↻ 다시 시작</button><button class="btn" id="pzOut">${run && run.wk ? '여기서 끝내기 (기록 남김)' : '나가기'}</button></div>
    <div class="row" style="margin-top:4px">${sndBtns()}</div>
    <div class="sub" style="margin-top:6px">다시 시작·나가기는 이번 판 결과 없이 처음으로 돌아가요.</div>`); bindSnd();
  $('pzGo').onclick = () => { ui.closeModal(); paused = false; };
  $('pzRe').onclick = () => { const wk = run && run.wk; ui.closeModal(); run = null; paused = false; WK_RUN = !!wk; try { startRun(); } finally { WK_RUN = false; } };   
  $('pzOut').onclick = () => { ui.closeModal(); paused = false; if (run && run.wk && !run.over) return wkEnd(run); ui.showHub(); }; };
$('btnExit').onclick = () => { if (!run || run.over) return; paused = true;
  ui.modal(`<h3 style="margin:0 0 6px">그만하고 나갈까요?</h3><div class="sub">${run.wk ? '지금까지 준 피해는 기록돼요.' : '이번 판은 결과 없이 끝나요.'}</div><div class="row"><button class="btn green" id="exGo">계속하기</button><button class="btn red" id="exOut">나가기</button></div>`);
  $('exGo').onclick = () => { ui.closeModal(); paused = false; };
  $('exOut').onclick = () => { ui.closeModal(); paused = false; if (run && run.wk && !run.over) return wkEnd(run); ui.showHub('lab'); }; };
document.addEventListener('touchmove', e => { if (ui._drag) e.preventDefault(); }, { passive: false });
canvas.addEventListener('pointerdown', e => {
  if (!run) return;
  if (stealthOn()) { const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height; run.sth.joy = { id: e.pointerId, bx: x, by: y, kx: x, ky: y, dx: 0, dy: 0, mag: 0 }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (hornAim) { const q = nearestOnPath(x, y); hornAim = false; $('hornBtn').classList.remove('aim'); if (!q || q.dist > 70) return toast('길 위를 눌러 주세요'); blowHorn(q.d); ui.tickHorn(); return; }
  { const a = (run.abs || []).find(a => Math.hypot(a.x - x, a.y - y) < 34); if (a) return pickAb(a); }
  if (false) { const f = map.forks.find(f => Math.hypot(f.sx - x, f.sy - y) < 30); if (f) { f.sw = f.sw === 'A' ? 'B' : 'A'; toast(f.sw === 'B' ? '지름길로! (많이 지나가면 면역이 적응해요)' : '원래 길로'); return; } }
  if (!aiming && !placing) { const t = run.towers.find(t => Math.hypot(t.x - x, t.y - 20 - y) < 26);
    if (t) { const d = TOWERS[t.type]; $('hint').textContent = `${d.name}: ${d.desc} · 사거리 ${d.range} · 처치 ${t.kills || 0}${d.aura ? '' : ` · ${TOWER_TIP[t.type]}`}`; run.rings.push({ x: t.x, y: t.y - 20, r: 8, R: t.range, t: 0.5, color: d.color }); return; } }
  if (aiming) {
    const t = run.towers.filter(t => !t.converted).sort((a, b) => Math.hypot(a.x - x, a.y - 20 - y) - Math.hypot(b.x - x, b.y - 20 - y))[0];
    if (!t || Math.hypot(t.x - x, t.y - 20 - y) > 50) return toast('탑을 정확히 눌러 주세요');
    const g = run.skillGenes.find(g => g.strain === aiming);
    if (SKILLS.hostify(g, t)) { run.cds[aiming] = geneStats(g).cd; for (const id of STRAINS[g.strain].skill.ids || []) if (id !== 'hostify') SKILLS[id](g); }
    aiming = null; $('hint').textContent = '스킬 카드를 길게 누르면 설명'; ui.renderSkills(); return;
  }
  if (placing) {
    const used = new Set([...run.towers, ...run.outposts].map(t => t.x + ',' + t.y));
    const s = map.slots.filter(s => !used.has(s[0] + ',' + s[1])).sort((a, b) => Math.hypot(a[0] - x, a[1] - y) - Math.hypot(b[0] - x, b[1] - y))[0];
    if (!s || Math.hypot(s[0] - x, s[1] - y) > 40) return toast('빈 받침을 눌러 주세요');
    const o = { type: placing, x: s[0], y: s[1] }; if (placing === 'out_decoy') { o.hp = o.maxHp = 260 * run.st.mul; }
    run.outposts.push(o); run.outLeft--; placing = null; $('outChooser').hidden = true; if (run.ta) ui.renderDeploy(); $('hint').textContent = `${OUTPOSTS[o.type].name} 설치`; ui.renderSkills();
  }
});
window.addEventListener('resize', () => { fit(); if (!run) ui.showHub(); });

if (save.lowq) { LOWQ = true; DPR = 1; }
loadAssets().then(() => { buildHybridImgs(); buildLegendImgs(); buildNewImgs(); save.squad = SL.map(i => (save.squad || [])[i] || null); normSquad();
  try { if (!squadGenes().length) autoSquad(); fit(); ui.showHub('body'); }
  catch (e) { console.error('BOOT', e);
    // 저장 때문에 화면을 못 그리면: 저장을 따로 보관하고 새로 시작 (데이터는 지우지 않음)
    try { localStorage.setItem(SAVE_KEY + '-broken-' + Date.now(), localStorage.getItem(SAVE_KEY) || ''); localStorage.removeItem(SAVE_KEY); } catch (e2) {}
    alert('저장 데이터를 읽다가 문제가 생겨서 새로 시작해요. 예전 기록은 따로 보관해 두었어요.'); location.reload(); return; }
  if (window.__saveBroken) setTimeout(() => toast('저장이 깨져서 새로 시작했어요 (예전 기록은 보관됨)'), 1500);
  if (save.heroRefund) { let back = 0; for (const [id, o] of Object.entries(save.heroes || {})) { if (!o || !HEROES[id]) continue; if (o.own && HEROES[id].unlock) back += HEROES[id].unlock; for (let l = 0; l < (o.lv || 0); l++) back += FORGE.cost(l); }
    delete save.heroRefund; if (back) { save.dna += back; save.heroBack = back; } persist(); }
  if (save.coreBack) { const n = save.coreBack; delete save.coreBack; persist(); setTimeout(() => toast(`본체 강화가 '레벨 하나'로 바뀌어 DNA ${n}을 돌려드렸어요`), 3800); }
  if (save.heroBack) { const n = save.heroBack; delete save.heroBack; persist(); setTimeout(() => toast(`슈퍼바이러스가 '본체 강화'로 바뀌어 DNA ${n}을 돌려드렸어요`), 2500); }
  requestAnimationFrame(frame); $('inGo').textContent = save.introSeen ? '▶ 이어하기' : '▶ 감염 시작'; requestAnimationFrame(introLoop); });
</script>
</body>
</html>
