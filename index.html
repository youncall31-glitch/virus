<style>

  .hc img { height: 42px; } .hc small { color: #ffcf6a; font-size: 10.5px; } .hc.on { border-color: #ffcf6a; box-shadow: 0 0 10px rgba(255,207,106,.5); } .hc.lock { opacity: .55; } .hc.lock small { color: #b59f86; }

  .hinfo h3 { margin: 0; font-size: 16px; } .hst { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 11.5px; margin: 5px 0; } .hst b { color: #ffd27a; font-family: Cinzel, serif; }

  .tslot img { height: 26px; } .tslot small { font-size: 9px; color: #b59f86; } .tslot.empty { border-style: dashed; color: #ffcf6a; } .tslot.empty b { font-size: 20px; } .tslot.lock { opacity: .5; } .tslot.lock img { height: 18px; }

function autoSquad() {                                   // 가장 강한 계통 하나에 집중 (간섭 회피) + 부족하면 다른 계통으로 채움
  const byStrain = {};
  for (const g of save.genes) (byStrain[g.strain] ||= []).push(g);
  const ranked = Object.entries(byStrain).map(([s, gs]) => [s, gs.sort((a, b) => power(b) - power(a))]).sort((a, b) => b[1].slice(0, 5).reduce((x, g) => x + power(g), 0) - a[1].slice(0, 5).reduce((x, g) => x + power(g), 0));
  const out = [];
  let leg = false;
  for (const [, gs] of ranked) for (const g of gs) if (out.length < RULES.slots) { if (STRAINS[g.strain].legend) { if (leg) continue; leg = true; } out.push(g.uid); }
  save.squad = [0, 1, 2].map(i => out[i] || null);
}

    <div class="sub" style="margin-top:6px">다시 시작·나가기는 이번 판 결과 없이 처음으로 돌아가요.</div>`); bindSnd();
  $('pzGo').onclick = () => { ui.closeModal(); paused = false; };
  $('pzRe').onclick = () => { ui.closeModal(); run = null; paused = false; startRun(); };
  $('pzOut').onclick = () => { ui.closeModal(); paused = false; ui.showHub(); }; };
canvas.addEventListener('pointerdown', e => {
  if (!run) return;
  if (stealthOn()) { const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height; run.sth.joy = { id: e.pointerId, bx: x, by: y, kx: x, ky: y, dx: 0, dy: 0, mag: 0 }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (!aiming && !placing) { const f = map.forks.find(f => Math.hypot(f.sx - x, f.sy - y) < 30); if (f) { f.sw = f.sw === 'A' ? 'B' : 'A'; toast(f.sw === 'B' ? '지름길로! (많이 지나가면 면역이 적응해요)' : '원래 길로'); return; } }
  if (!aiming && !placing) { const t = run.towers.find(t => Math.hypot(t.x - x, t.y - 20 - y) < 26);
    if (t) { const d = TOWERS[t.type]; $('hint').textContent = `${d.name}: ${d.desc} · 사거리 ${d.range} · 처치 ${t.kills || 0}${d.aura ? '' : ` · ${TOWER_TIP[t.type]}`}`; run.rings.push({ x: t.x, y: t.y - 20, r: 8, R: t.range, t: 0.5, color: d.color }); return; } }
  if (aiming) {
    const t = run.towers.filter(t => !t.converted).sort((a, b) => Math.hypot(a.x - x, a.y - 20 - y) - Math.hypot(b.x - x, b.y - 20 - y))[0];
    if (!t || Math.hypot(t.x - x, t.y - 20 - y) > 50) return toast('탑을 정확히 눌러 주세요');
    const g = run.skillGenes.find(g => g.strain === aiming);
    if (SKILLS.hostify(g, t)) { run.cds[aiming] = geneStats(g).cd; for (const id of STRAINS[g.strain].skill.ids || []) if (id !== 'hostify') SKILLS[id](g); }
    aiming = null; $('hint').textContent = '스킬을 누르면 즉시 발동'; ui.renderSkills(); return;
  }
  if (placing) {
    const used = new Set([...run.towers, ...run.outposts].map(t => t.x + ',' + t.y));
    const s = map.slots.filter(s => !used.has(s[0] + ',' + s[1])).sort((a, b) => Math.hypot(a[0] - x, a[1] - y) - Math.hypot(b[0] - x, b[1] - y))[0];
    if (!s || Math.hypot(s[0] - x, s[1] - y) > 40) return toast('빈 받침을 눌러 주세요');
    const o = { type: placing, x: s[0], y: s[1] }; if (placing === 'out_decoy') { o.hp = o.maxHp = 260 * run.st.mul; }
    run.outposts.push(o); run.outLeft--; placing = null; $('outChooser').hidden = true; if (run.ta) ui.renderDeploy(); $('hint').textContent = `${OUTPOSTS[o.type].name} 설치`; ui.renderSkills();
  }
});
window.addEventListener('resize', () => { fit(); if (!run) ui.showHub(); });

loadAssets().then(() => { buildHybridImgs(); buildLegendImgs(); save.squad = [0, 1, 2].map(i => (save.squad || [])[i] || null); if (!squadGenes().length) autoSquad(); fit(); ui.showHub('body'); requestAnimationFrame(frame); $('inGo').textContent = save.introSeen ? '▶ 이어하기' : '▶ 감염 시작'; if (has('intro_bg')) $('inTop').style.display = 'none'; else if (has('title_logo')) document.querySelector('.inTitle').innerHTML = '<img src="assets/title_logo.png" alt="진화하는 바이러스">'; requestAnimationFrame(introLoop); });
</script>
